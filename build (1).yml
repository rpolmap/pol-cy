name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip all zips in repo
        run: |
          find . -type f -name '*.zip' -not -path './.git/*' -print0 |
          while IFS= read -r -d '' zipfile; do
            echo "Unzipping $zipfile"
            unzip -o -q "$zipfile" -d "$(dirname "$zipfile")"
          done

      - name: Commit extracted files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unzip archives [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle -p custom-keyboard assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Polish-Cyrillic-Keyboard-APK
          path: custom-keyboard/app/build/outputs/apk/debug/*.apk
